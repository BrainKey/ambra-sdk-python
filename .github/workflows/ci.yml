name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run tests
        # Integration tests need live Ambra credentials and are skipped in CI.
        env:
          AMBRA_SKIP_INTEGRATION: '1'
        run: uv run --frozen pytest

  security:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Audit resolved dependencies for known vulnerabilities
        run: |
          uv export --all-extras --no-hashes --no-emit-project > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt
