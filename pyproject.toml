[project]
name = "ambra-sdk-brainkey"
version = "3.33.0"
description = "Ambrahealth python SDK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Ambrahealth AI team", email = "python-sdk@ambrahealth.com" },
]
maintainers = [
    { name = "Mitchell Berry", email = "mitchell@brainkey.ai" },
]
keywords = ["ambrahealth", "ambra"]
classifiers = [
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.24.0",
    "aiohttp>=3.6.2",
    "python-box>=5.1.1",
    "pydicom>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.1",
    "mypy>=0.782",
    "pytest-cov>=2.10.1",
    "dynaconf>=3.1.0",
    "beautifulsoup4>=4.8.2",
    "jinja2>=2.11.1",
    "requests-mock>=1.8.0",
    "sphinx>=3.2.1",
    "tox>=3.19.0",
    "tomlkit>=0.5.11",
    "gitpython>=3.1.0",
    "sphinxcontrib-spelling>=5.3.0",
    "pytest-asyncio>=0.15.1",
    "aioresponses>=0.7.2",
]

[project.urls]
Homepage = "https://github.com/BrainKey/ambra-sdk-python"
Repository = "https://github.com/BrainKey/ambra-sdk-python"
Documentation = "https://dicomgrid.github.io/sdk-python/index.html"

[project.scripts]
bump_release_candidate = "release:bump_release_candidate"
start_release = "release:start_release"
bump_release = "release:bump_release"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ambra_sdk"]
